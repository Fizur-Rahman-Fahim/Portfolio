<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Mess Manager architecture</title>
  <desc id="d">Android app talks over HTTPS with JWT to a Django REST API on Render, which uses PostgreSQL on Supabase and also serves Django Admin.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="898" height="268" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <g font-family="Segoe UI, Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="30" y="70" width="220" height="80" rx="10" fill="#e8f1ff" stroke="#2b6cb0" stroke-width="2"/>
    <text x="140" y="104" font-size="18" font-weight="700" fill="#1a365d">Android app</text>
    <text x="140" y="130" font-size="14" fill="#2c5282">React Native + Expo</text>

    <rect x="340" y="70" width="220" height="80" rx="10" fill="#e7f6ec" stroke="#2f855a" stroke-width="2"/>
    <text x="450" y="104" font-size="18" font-weight="700" fill="#22543d">Django REST API</text>
    <text x="450" y="130" font-size="14" fill="#276749">Render</text>

    <rect x="650" y="70" width="220" height="80" rx="10" fill="#fdf0e1" stroke="#c05621" stroke-width="2"/>
    <text x="760" y="104" font-size="18" font-weight="700" fill="#7b341e">PostgreSQL</text>
    <text x="760" y="130" font-size="14" fill="#9c4221">Supabase</text>

    <rect x="340" y="190" width="220" height="56" rx="10" fill="#f3e8ff" stroke="#6b46c1" stroke-width="2"/>
    <text x="450" y="224" font-size="17" font-weight="700" fill="#44337a">Django Admin</text>

    <text x="295" y="98" font-size="13" fill="#4a5568">HTTPS + JWT</text>
    <text x="605" y="98" font-size="13" fill="#4a5568">SQL (SSL)</text>
  </g>
  <g stroke="#4a5568" stroke-width="2" fill="none">
    <line x1="252" y1="110" x2="338" y2="110" marker-end="url(#arrow)"/>
    <line x1="562" y1="110" x2="648" y2="110" marker-end="url(#arrow)"/>
    <line x1="450" y1="152" x2="450" y2="188" marker-end="url(#arrow)"/>
  </g>
</svg>
